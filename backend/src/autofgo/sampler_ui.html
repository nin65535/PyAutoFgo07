<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/autofgo-icon.svg">
<title>カード参照サンプラー</title>
<style>
  :root{font:16px system-ui,sans-serif;color:#e9eef5;background:#101923}*{box-sizing:border-box}body{margin:0}header{padding:16px 24px;background:#1d2c3b;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px}.brand img{width:38px;height:38px;flex:none}h1{font-size:1.4rem;margin:0}h2{font-size:1.1rem;margin:0 0 12px}main{display:grid;grid-template-columns:minmax(350px,1.2fr) minmax(350px,1fr);gap:16px;padding:16px;max-width:1900px;margin:auto}.panel{background:#1b2937;border:1px solid #385068;border-radius:10px;padding:18px;min-width:0}.wide{grid-column:1/-1}button,select,input{font:inherit}button,select,input[type=url]{background:#263c51;color:#fff;border:1px solid #66809b;border-radius:6px;padding:9px}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:hover:not(:disabled){background:#35536c}label{display:block;margin:8px 0}select,input[type=url]{width:100%}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.drop{border:2px dashed #728eaa;padding:20px;border-radius:8px;text-align:center}.drop.drag{background:#335777}.hint{color:#b8c9d9;font-size:.9rem}.error{color:#ffb4a7}.success{color:#9de4bb}#sourceWrap{position:relative;margin-top:12px;display:inline-block;max-width:100%;line-height:0}#source{display:block;max-width:100%;max-height:55vh}#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.cards button,.candidates button{display:inline-flex;flex-direction:column;align-items:center;gap:4px}.cards button.active,.candidates button.active{outline:3px solid #f9c85f}.cards{display:flex;gap:8px;flex-wrap:wrap}.sizes label{display:inline-block;margin-right:15px}.candidates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.candidates img{width:100%;max-width:150px;image-rendering:pixelated}.selected{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.selected img{width:220px;image-rendering:pixelated}.thumbs{display:flex;gap:10px;flex-wrap:wrap}.thumbs img{width:85px;height:85px;object-fit:contain;background:#101923}.thumbs figure{margin:0;text-align:center}.confirm{border:1px solid #e4bc67;padding:14px;border-radius:8px;margin-top:14px}#file{max-width:100%}@media(max-width:900px){main{display:block}.panel{margin-bottom:14px}}
</style>
<header><div class="brand"><img src="/autofgo-icon.svg" alt=""><h1>カード参照サンプラー</h1></div><span id="status" role="status">接続中</span></header>
<div id="startupWarning" role="alert" hidden style="margin:12px 16px;padding:12px;border:2px solid #e4bc67;border-radius:8px;background:#4b391d;color:#fff">プレイヤーも起動中です。保存した参照は次のAll/Wave開始時に反映されます。 <button id="dismissStartupWarning" type="button">閉じる</button></div>
<main>
  <section class="panel"><h2>1. キャラクターと衣装</h2><label>キャラクター<select id="character"></select></label><p id="displayName" class="hint"></p><label>衣装<select id="appearance"></select></label><div id="references" class="thumbs"></div></section>
  <section class="panel"><h2>2. ステータス画像</h2><div id="drop" class="drop"><p>PNGをここへドロップ、または画像を貼り付け（Ctrl+V）</p><input id="file" type="file" accept="image/png"><div class="row" style="justify-content:center;margin-top:10px"><button id="clipboard" type="button">クリップボードから読み込む</button><button id="discard" type="button">画像を破棄</button></div></div><p class="hint">PNG / 最大12 MiB・1200万画素。元画像は保存・破棄・終了時に消去します。</p><label>出典URL（分かる場合のみ）<input id="sourceUrl" type="url" placeholder="https://..."></label></section>
  <section class="panel wide"><h2>3. 切り出し元カード</h2><div id="cards" class="cards"></div><div id="sourceWrap"><img id="source" alt="入力画像"><svg id="overlay" aria-hidden="true"></svg></div></section>
  <section class="panel"><h2>4. サイズと9候補</h2><div id="sizes" class="sizes"></div><div id="candidates" class="candidates"></div></section>
  <section class="panel"><h2>5. 選択内容と保存</h2><div id="selected" class="selected"></div><div class="confirm"><p id="summary">画像と候補を選択してください。</p><label><input id="confirmed" type="checkbox"> 名前・衣装・画像の内容を目視で確認しました</label><button id="save" type="button" disabled>確認して保存</button></div></section>
</main><script type="module" src="/sampler-ui.js"></script>
</html>
