[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autofgo-backend"
version = "0.1.0"
description = "Local FastAPI backend for autoFgo"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "pillow==12.1.1",
  "pydantic-settings==2.15.0",
  "pyautogui==0.9.54",
  "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autofgo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
